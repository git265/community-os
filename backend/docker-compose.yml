# The v2 stack in one command (run from backend/):   docker compose up -d --build
#   postgres  PostgreSQL 18, the 156-table v2 schema (Flyway migrates it when api starts)   localhost:5432
#   api       backend/api, Spring Boot on Java 25, /api/v1                                  localhost:8080
#   seed      one-shot: the first community, its Super Admin and Villa 1..212 (idempotent)
#   demo      one-shot: loads the browser's sample data into that community (dev profile only; idempotent; skip with  --scale demo=0)
#   web       the app built for the v2 API, served by nginx; /api is forwarded to api        http://localhost:8081
#
# Sign in at http://localhost:8081 with SEED_ADMIN_PHONE, or pick anyone from the demo roster on the sign-in page. The dev profile prints the one-time code in the api log:
#   docker compose logs -f api | grep "sign-in code"
# Payments use the simulated provider. For anything real, set the COS_* secrets and SPRING_PROFILES_ACTIVE=prod
# (see docs/REDESIGN.md section 11).
# Its own project name (and so its own pgdata volume): the default name "backend" was used by the retired v1 stack, whose database the
# v2 API cannot start on.
name: communityos-v2

x-db: &db
  POSTGRES_DB: communityos
  POSTGRES_USER: cos_owner
  POSTGRES_PASSWORD: ${COS_DB_OWNER_PASSWORD:-cos_owner_dev}
  COS_APP_PASSWORD: ${COS_DB_APP_PASSWORD:-cos_app_dev}
  COS_PLATFORM_PASSWORD: ${COS_DB_PLATFORM_PASSWORD:-cos_platform_dev}

services:
  postgres:
    image: postgres:18
    environment: *db
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql                      # 18+ images keep data in /var/lib/postgresql/18/docker: mount the parent
      - ./api/docker/initdb:/docker-entrypoint-initdb.d:ro   # creates the cos_app / cos_platform login roles on first start
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U cos_owner -d communityos"], interval: 5s, retries: 20 }

  api:
    build: { context: ./api }
    depends_on: { postgres: { condition: service_healthy }, clamav: { condition: service_started } }
    ports: ["8080:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # migrations run as the schema owner; the API itself connects as the two runtime roles
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/communityos
      SPRING_FLYWAY_USER: cos_owner
      SPRING_FLYWAY_PASSWORD: ${COS_DB_OWNER_PASSWORD:-cos_owner_dev}
      COS_DB_APP_URL: jdbc:postgresql://postgres:5432/communityos
      COS_DB_APP_USERNAME: cos_app
      COS_DB_APP_PASSWORD: ${COS_DB_APP_PASSWORD:-cos_app_dev}
      COS_DB_PLATFORM_URL: jdbc:postgresql://postgres:5432/communityos
      COS_DB_PLATFORM_USERNAME: cos_platform
      COS_DB_PLATFORM_PASSWORD: ${COS_DB_PLATFORM_PASSWORD:-cos_platform_dev}
      COS_AUTH_ISSUER: http://localhost:8081
      COS_WEB_ALLOWED_ORIGINS: http://localhost:8081,http://localhost:5173
      # production secrets (leave empty in dev: the dev profile uses a throw-away signing key and a dev pepper)
      COS_JWT_SIGNING_KEY: ${COS_JWT_SIGNING_KEY:-}
      COS_RAZORPAY_ENABLED: ${COS_RAZORPAY_ENABLED:-false}
      COS_RAZORPAY_KEY_ID: ${COS_RAZORPAY_KEY_ID:-}
      COS_RAZORPAY_KEY_SECRET: ${COS_RAZORPAY_KEY_SECRET:-}
      COS_RAZORPAY_WEBHOOK_SECRET: ${COS_RAZORPAY_WEBHOOK_SECRET:-}
      COS_FILES_DIR: /data/files                          # uploaded files' bytes
      COS_FILES_SCANNER: ${COS_FILES_SCANNER:-clamav}     # every upload is scanned by ClamAV (the clamav service) before others can open it
      COS_FILES_CLAMAV_HOST: clamav
    volumes: ["files:/data/files"]

  # ClamAV (free, open source): clamd on 3310, signatures kept up to date by freshclam inside the image. The first start downloads
  # the signatures (a few minutes); until then uploads stay "Pending" and the API's rescan job scans them when clamd is up.
  clamav:
    image: clamav/clamav:stable
    volumes: ["clamdb:/var/lib/clamav"]
    healthcheck: { test: ["CMD", "clamdcheck.sh"], interval: 30s, timeout: 10s, retries: 20, start_period: 300s }

  seed:
    image: postgres:18
    depends_on: { api: { condition: service_healthy } }
    environment: { PGPASSWORD: "${COS_DB_OWNER_PASSWORD:-cos_owner_dev}" }
    volumes: ["./api/docker/seed.sql:/seed.sql:ro"]
    command: >
      psql -h postgres -U cos_owner -d communityos -X -q
      -v slug=${SEED_COMMUNITY_SLUG:-la-paloma} -v name="${SEED_COMMUNITY_NAME:-La Paloma}"
      -v phone=${SEED_ADMIN_PHONE:-+919800000000} -v admin="${SEED_ADMIN_NAME:-Super Admin}" -v villas=${SEED_VILLAS:-212}
      -f /seed.sql
    restart: "no"

  demo:
    image: curlimages/curl:8.10.1
    depends_on: { seed: { condition: service_completed_successfully } }
    command: >
      sh -c "curl -sS -X POST http://api:8080/api/v1/demo/load/${SEED_COMMUNITY_SLUG:-la-paloma}; echo"
    restart: "no"

  web:
    build: { context: .., dockerfile: docker/web.Dockerfile }
    depends_on: { api: { condition: service_healthy } }
    ports: ["8081:80"]

volumes: { pgdata: {}, files: {}, clamdb: {} }
