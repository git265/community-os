server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 26m;

  # the API (backend/api) on the same origin
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 60s;
  }

  # the live notification stream: one long response per open app, passed through as it is written
  location = /api/v1/notifications/stream {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 6m;
  }

  # the app: built files are cached, index.html never is; any other path (/c/<community>, /platform ...) is the app
  location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
